name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The game core has no DOM dependency, so the whole suite runs headless.
      # No install step: there are no dependencies.
      # Each game owns its tests and runs them from its own directory. That is
      # the practical payoff of the split: work on claudeSouls can never turn
      # claudeHack's CI red, and vice versa.
      #
      # docs/GUIDE.zh-TW.md is generated from js/ui/guide-zh.js. If someone
      # edits the guide and forgets to regenerate, the in-game manual and the
      # repository document silently disagree - which is exactly the failure
      # mode keeping one source was meant to prevent.
      - name: classic - Chinese guide is in sync
        working-directory: classic
        run: node tools/build_guide.mjs --check

      - name: classic - system tests
        working-directory: classic
        run: node tools/systest.mjs

      - name: classic - crash fuzzing
        working-directory: classic
        run: node tools/smoketest.mjs 60 3000

      - name: classic - bot playthroughs
        working-directory: classic
        run: node tools/botrun.mjs 12 30000

      # Kept small on purpose. systest already generates all 26 depths across 12
      # seeds and drives the win path end to end; this is only here to prove the
      # bot's own deep-dungeon path still runs, and a longer run was by far the
      # slowest thing in the workflow for no extra coverage.
      - name: classic - deep-dungeon bot
        working-directory: classic
        run: node tools/botrun.mjs --god 1 6000

      - name: claudeSouls - system tests
        working-directory: claudeSouls
        run: node tools/systest.mjs

      # The deterministic combat means this bot is a balance instrument, not
      # just a crash test: it plays the read-and-react loop correctly, so a
      # failure here means the numbers are wrong rather than the player.
      - name: claudeSouls - telegraph-reading bot
        working-directory: claudeSouls
        run: node tools/botrun.mjs 12 20000
