name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is the repository. There is no build step: index.html, css/, js/ and
# assets/ are uploaded as they are, which is the whole point of shipping plain
# ES modules with no bundler.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
